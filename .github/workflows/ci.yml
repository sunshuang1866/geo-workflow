name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Format check (black)
        run: black --check .claude/skills/

      - name: Lint (flake8)
        run: flake8 .claude/skills/ --max-line-length=100

      - name: Test & coverage
        run: python3 -m pytest --tb=short
